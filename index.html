<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#e8d5ff" />
<title>Efe'den Ecrin'e</title>
<link rel="canonical" href="https://efedenencrine.com" />
<meta property="og:url" content="https://efedenencrine.com" />
<meta property="og:title" content="Efe'den Ecrin'e" />
<meta property="og:description" content="Hala Küs Müyüz?" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --ink: #3d2b5c;
    --ink-soft: #6b5a90;
    --pink: #ff9ecb;
    --lila: #c9a7f5;
    --blue: #9fd0ff;
  }

  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    background:
      radial-gradient(ellipse 90% 70% at 15% 10%, #ffd9ec 0%, transparent 55%),
      radial-gradient(ellipse 80% 60% at 85% 20%, #d9c8ff 0%, transparent 55%),
      radial-gradient(ellipse 90% 70% at 25% 90%, #c3ddff 0%, transparent 55%),
      radial-gradient(ellipse 80% 60% at 80% 95%, #ffc9e3 0%, transparent 60%),
      linear-gradient(160deg, #f3e7ff 0%, #ffe4f1 45%, #deebff 100%);
  }

  /* --- Aurora ışık katmanı --- */
  .aurora {
    position: fixed;
    inset: -20%;
    z-index: 0;
    pointer-events: none;
    filter: blur(90px);
    opacity: .85;
  }
  .aurora span {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
  }
  .aurora span:nth-child(1) {
    width: 55vw; height: 55vw; min-width: 320px; min-height: 320px;
    top: 0%; left: 0%;
    background: radial-gradient(circle, #d0b4ff 0%, transparent 70%);
    animation: aur1 18s ease-in-out infinite;
  }
  .aurora span:nth-child(2) {
    width: 50vw; height: 50vw; min-width: 300px; min-height: 300px;
    top: 20%; right: -5%;
    background: radial-gradient(circle, #ffb8dc 0%, transparent 70%);
    animation: aur2 22s ease-in-out infinite;
  }
  .aurora span:nth-child(3) {
    width: 45vw; height: 45vw; min-width: 260px; min-height: 260px;
    bottom: -10%; left: 25%;
    background: radial-gradient(circle, #a9d4ff 0%, transparent 70%);
    animation: aur1 26s ease-in-out infinite reverse;
  }
  @keyframes aur1 {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(8vw, 6vh) scale(1.18); }
  }
  @keyframes aur2 {
    0%, 100% { transform: translate(0, 0) scale(1.08); }
    50%      { transform: translate(-9vw, -7vh) scale(.88); }
  }

  /* --- Parıldayan yıldızlar --- */
  .sparkles {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    overflow: hidden;
  }
  .sparkle {
    position: absolute;
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    background: #ffffff;
    box-shadow:
      0 0 calc(var(--s) * 1.5) rgba(255, 255, 255, .95),
      0 0 calc(var(--s) * 3) rgba(220, 190, 255, .7);
    opacity: 0;
    animation: twinkle var(--d) ease-in-out infinite;
    animation-delay: var(--delay);
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0; transform: scale(.3); }
    50%      { opacity: .95; transform: scale(1); }
  }

  /* --- Uçuşan kalpler (arka plan) --- */
  .bg-hearts {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    overflow: hidden;
  }
  .bg-heart {
    position: absolute;
    bottom: -100px;
    width: var(--s);
    height: var(--s);
    background: var(--c);
    transform: rotate(-45deg);
    opacity: 0;
    filter: drop-shadow(0 0 8px var(--c));
    animation-name: bgFloat;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    will-change: transform, opacity;
  }
  .bg-heart::before,
  .bg-heart::after {
    content: '';
    position: absolute;
    width: var(--s);
    height: var(--s);
    border-radius: 50%;
    background: var(--c);
  }
  .bg-heart::before { top: calc(var(--s) / -2); left: 0; }
  .bg-heart::after  { top: 0; left: calc(var(--s) / 2); }

  @keyframes bgFloat {
    0%   { transform: translateY(0) rotate(-45deg) scale(.35); opacity: 0; }
    10%  { opacity: .75; }
    88%  { opacity: .75; }
    100% { transform: translateY(-125vh) rotate(-45deg) scale(1.15); opacity: 0; }
  }

  /* --- Üst başlık --- */
  .brand {
    position: fixed;
    top: max(16px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    z-index: 80;
    padding: 10px 26px;
    border-radius: 999px;
    font-family: 'Fraunces', serif;
    font-size: 1rem;
    font-weight: 600;
    font-style: italic;
    letter-spacing: .04em;
    white-space: nowrap;
    color: #ffffff;
    background: linear-gradient(135deg, rgba(160, 130, 220, .55), rgba(220, 130, 180, .55));
    border: 1px solid rgba(255, 255, 255, .85);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    box-shadow:
      0 10px 32px rgba(150, 100, 200, .3),
      0 0 0 4px rgba(255, 255, 255, .15),
      inset 0 1px 0 rgba(255, 255, 255, .7);
    text-shadow: 0 1px 12px rgba(110, 70, 160, .55);
  }

  /* --- Sahneler --- */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 46px;
    padding: 110px 24px 56px;
    text-align: center;
    opacity: 1;
    transform: scale(1);
    transition: opacity .55s ease, transform .55s ease;
    z-index: 10;
  }
  .stage.gone {
    opacity: 0;
    transform: scale(.9);
    pointer-events: none;
  }

  .ask {
    margin: 0;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(2.1rem, 9vw, 4rem);
    line-height: 1.1;
    letter-spacing: -.02em;
    color: var(--ink);
    text-shadow:
      0 2px 24px rgba(255, 255, 255, 1),
      0 0 40px rgba(255, 255, 255, .9);
    max-width: 12em;
    position: relative;
  }

  .ask::after {
    content: '';
    position: absolute;
    left: 50%;
    bottom: -18px;
    transform: translateX(-50%);
    width: 60px;
    height: 3px;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, #c9a7f5, #ff9ecb, #c9a7f5, transparent);
    opacity: .8;
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    flex-wrap: wrap;
  }

  .btn {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: .02em;
    padding: 17px 50px;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    position: relative;
    transition:
      transform .4s cubic-bezier(.34, 1.56, .64, 1),
      box-shadow .35s ease,
      left .4s cubic-bezier(.34, 1.56, .64, 1),
      top .4s cubic-bezier(.34, 1.56, .64, 1);
  }

  .btn-evet {
    z-index: 5;
    color: #ffffff;
    background: linear-gradient(135deg, #a58cf5 0%, #c77fe8 45%, #f08ec4 100%);
    box-shadow:
      0 14px 36px rgba(150, 100, 220, .45),
      0 0 0 4px rgba(255, 255, 255, .35),
      inset 0 1px 0 rgba(255, 255, 255, .6);
    transform-origin: center center;
    will-change: transform;
    overflow: hidden;
  }
  .btn-evet::before {
    content: '';
    position: absolute;
    top: 0; left: -60%;
    width: 60%; height: 100%;
    background: linear-gradient(120deg, transparent, rgba(255, 255, 255, .55), transparent);
    transform: skewX(-20deg);
    animation: shine 3.5s ease-in-out infinite;
  }
  @keyframes shine {
    0%   { left: -60%; }
    55%  { left: 130%; }
    100% { left: 130%; }
  }
  .btn-evet:active { filter: brightness(.96); }

  .btn-hayir {
    z-index: 60;
    color: var(--ink-soft);
    background: rgba(255, 255, 255, .95);
    border: 1px solid rgba(255, 255, 255, .9);
    box-shadow:
      0 12px 28px rgba(150, 130, 190, .28),
      inset 0 1px 0 rgba(255, 255, 255, 1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    will-change: left, top, transform;
  }

  /* --- Son sahne --- */
  #final {
    gap: 28px;
    padding-top: 112px;
  }

  .yep {
    margin: 0;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: clamp(3.4rem, 19vw, 9.5rem);
    line-height: 1;
    letter-spacing: -.03em;
    background: linear-gradient(100deg, #a58cf5 0%, #f07ec4 45%, #6bb0ff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    filter:
      drop-shadow(0 10px 26px rgba(180, 120, 220, .5))
      drop-shadow(0 0 30px rgba(255, 200, 240, .7));
    animation:
      popIn 1s cubic-bezier(.2, 1.7, .45, 1) both,
      floaty 3.6s ease-in-out 1.1s infinite;
    position: relative;
  }

  @keyframes popIn {
    0%   { transform: scale(.2) rotate(-10deg); opacity: 0; }
    62%  { transform: scale(1.16) rotate(3deg); opacity: 1; }
    100% { transform: scale(1) rotate(0deg);   opacity: 1; }
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-10px); }
  }

  .cat-frame {
    display: flex;
    align-items: center;
    justify-content: center;
    width: clamp(210px, 62vw, 360px);
    height: clamp(210px, 62vw, 360px);
    border-radius: 40px;
    padding: 12px;
    background:
      linear-gradient(135deg, rgba(255, 255, 255, .8), rgba(255, 255, 255, .55));
    border: 1.5px solid rgba(255, 255, 255, .95);
    backdrop-filter: blur(16px) saturate(160%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    box-shadow:
      0 26px 60px rgba(140, 110, 200, .32),
      0 0 0 6px rgba(255, 255, 255, .2),
      inset 0 1px 0 rgba(255, 255, 255, 1);
    overflow: hidden;
    animation: catBounce 3s ease-in-out infinite;
    position: relative;
  }

  .cat-frame::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 40px;
    background: linear-gradient(135deg, transparent 40%, rgba(255, 255, 255, .35) 50%, transparent 60%);
    pointer-events: none;
  }

  @keyframes catBounce {
    0%, 100% { transform: translateY(0) scale(1); }
    50%      { transform: translateY(-12px) scale(1.025); }
  }

  #catGif {
    width: 100%;
    height: 100%;
    object-fit: contain;
    border-radius: 30px;
    display: block;
    position: relative;
    z-index: 1;
  }
  #catFallback {
    display: none;
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 1;
  }
  #catFallback svg { width: 100%; height: 100%; display: block; }

  .devam {
    margin: 0;
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-style: italic;
    font-size: clamp(1.4rem, 6.4vw, 2.2rem);
    color: var(--ink-soft);
    text-shadow: 0 2px 18px rgba(255, 255, 255, 1);
    animation: popIn 1s cubic-bezier(.2, 1.7, .45, 1) .4s both;
  }

  .link-pill {
    display: inline-block;
    margin-top: 6px;
    padding: 12px 28px;
    border-radius: 999px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: .92rem;
    font-weight: 600;
    letter-spacing: .08em;
    text-transform: lowercase;
    color: var(--ink-soft);
    text-decoration: none;
    background: rgba(255, 255, 255, .85);
    border: 1px solid rgba(255, 255, 255, .95);
    box-shadow:
      0 12px 30px rgba(150, 130, 190, .25),
      inset 0 1px 0 rgba(255, 255, 255, 1);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    transition: transform .35s cubic-bezier(.34, 1.56, .64, 1), box-shadow .35s ease, color .3s ease;
    animation: popIn 1s cubic-bezier(.2, 1.7, .45, 1) .6s both;
  }
  .link-pill:hover {
    transform: translateY(-4px) scale(1.05);
    box-shadow: 0 18px 38px rgba(150, 130, 190, .35);
    color: #a05cc8;
  }
  .link-pill:active { transform: scale(.97); }

  @media (max-width: 420px) {
    .btn { padding: 16px 40px; font-size: 1.08rem; }
    .stage { gap: 38px; }
    .brand { font-size: .92rem; padding: 9px 22px; }
    .ask::after { bottom: -14px; }
  }
</style>
</head>
<body>

  <div class="aurora">

        <svg viewBox="0 0 220 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kalp Yapan Kedi">
          <defs>
            <radialGradient id="catBodyG" cx="50%" cy="40%" r="70%">
              <stop offset="0%" stop-color="#f4e9ff"/>

            </radialGradient>
            <radialGradient id="heartG" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="#ffb8dc"/>

            </radialGradient>
          </defs>
          <path d="M110 86 C103 66 76 62 68 79 C60 96 81 113 110 136 C139 113 160 96 152 79 C144 62 117 66 110 86 Z" fill="url(#heartG)"/>
          <path d="M62 158 L50 108 L94 132 Z" fill="#c3a4f0"/>
          <path d="M158 158 L170 108 L126 132 Z" fill="#c3a4f0"/>
          <ellipse cx="110" cy="186" rx="64" ry="54" fill="url(#catBodyG)"/>
          <ellipse cx="87" cy="178" rx="6.5" ry="8.5" fill="#3d2b5c"/>
          <ellipse cx="133" cy="178" rx="6.5" ry="8.5" fill="#3d2b5c"/>

  </section>

<script>
(function () {
  'use strict';

  var rnd = function (min, max) { return Math.random() * (max - min) + min; };
  var canHover = window.matchMedia && window.matchMedia('(hover: hover)').matches;

  /* ---------- Parıldayan yıldızlar ---------- */
  var sparkles = document.getElementById('sparkles');
  (function spawnSparkles() {
    for (var i = 0; i < 40; i++) {
      var s = document.createElement('div');
      s.className = 'sparkle';
      var size = rnd(2, 6).toFixed(1) + 'px';
      s.style.setProperty('--s', size);
      s.style.setProperty('--d', rnd(2.5, 6).toFixed(2) + 's');
      s.style.setProperty('--delay', rnd(0, 6).toFixed(2) + 's');
      s.style.left = rnd(0, 100).toFixed(2) + 'vw';
      s.style.top = rnd(0, 100).toFixed(2) + 'vh';
      sparkles.appendChild(s);
    }
  })();

  /* ---------- Arka plan kalpleri ---------- */
  var bgHearts = document.getElementById('bgHearts');
  var bgColors = [
    'rgba(255, 158, 203, .6)',
    'rgba(201, 167, 245, .6)',
    'rgba(159, 208, 255, .6)',
    'rgba(255, 196, 225, .6)',
    'rgba(184, 166, 255, .6)',
    'rgba(255, 176, 212, .6)'
  ];

  (function spawnBgHearts() {
    for (var i = 0; i < 20; i++) {
      var h = document.createElement('div');
      h.className = 'bg-heart';
      var size = rnd(14, 36).toFixed(1) + 'px';
      h.style.setProperty('--s', size);
      h.style.setProperty('--c', bgColors[Math.floor(Math.random() * bgColors.length)]);
      h.style.left = rnd(-2, 98).toFixed(1) + 'vw';
      h.style.animationDuration = rnd(10, 19).toFixed(1) + 's';
      h.style.animationDelay = rnd(0, 14).toFixed(1) + 's';
      bgHearts.appendChild(h);
    }
  })();

  /* ---------- Sahne yönetimi ---------- */
  var stages = {
    1: document.getElementById('stage1'),
    2: document.getElementById('stage2'),
    3: document.getElementById('final')
  };

  function goTo(n) {
    Object.keys(stages).forEach(function (k) {
      var s = stages[k];
      if (Number(k) === n) s.classList.remove('gone');
      else s.classList.add('gone');
    });
  }

  /* ---------- Buton mantığı ---------- */
  function wireStage(opts) {
    var evet = opts.evet;
    var hayir = opts.hayir;
    var step = opts.step;
    var maxScale = opts.maxScale;
    var onDone = opts.onDone;

    var taps = 0;
    var finished = false;
    var pinned = false;
    var lastEscape = 0;

    function pinHayir() {
      if (pinned) return;
      pinned = true;
      var r = hayir.getBoundingClientRect();
      hayir.style.position = 'fixed';
      hayir.style.left = r.left + 'px';
      hayir.style.top = r.top + 'px';
      hayir.style.width = r.width + 'px';
      hayir.style.margin = '0';
      void hayir.offsetWidth;
    }

    function escape() {
      var now = Date.now();
      if (now - lastEscape < 150) return;
      lastEscape = now;

      pinHayir();

      var pad = 14;
      var w = hayir.offsetWidth || 120;
      var h = hayir.offsetHeight || 54;
      var vw = window.innerWidth;
      var vh = window.innerHeight;

      var maxX = Math.max(pad, vw - w - pad);
      var maxY = Math.max(pad, vh - h - pad);

      var x = rnd(pad, maxX);
      var y = rnd(pad, maxY);

      hayir.style.left = x + 'px';
      hayir.style.top = y + 'px';
      hayir.style.transform = 'rotate(' + rnd(-18, 18).toFixed(1) + 'deg)';

      taps++;
      var scale = Math.min(1 + taps * step, maxScale);
      evet.style.transform = 'scale(' + scale + ')';
    }

    hayir.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      escape();
    });
    hayir.addEventListener('click', function (e) { e.preventDefault(); });

    if (canHover) {
      hayir.addEventListener('mouseenter', escape);
    }

    evet.addEventListener('click', function (e) {
      e.preventDefault();
      if (finished) return;
      finished = true;
      onDone();
    });
  }

  wireStage({
    evet: document.getElementById('evet1'),
    hayir: document.getElementById('hayir1'),
    step: 0.55,
    maxScale: 5,
    onDone: function () { goTo(2); }
  });

  wireStage({
    evet: document.getElementById('evet2'),
    hayir: document.getElementById('hayir2'),
    step: 1.8,
    maxScale: 32,
    onDone: function () { goTo(3); }
  });

  /* ---------- Kedi GIF'i ---------- */
  var catGif = document.getElementById('catGif');
  var catFallback = document.getElementById('catFallback');

  var catSources = [
    'https://media.giphy.com/media/GeimqsH0TLDt4tScGw/giphy.gif',
    'https://media.giphy.com/media/JIX9t2j0ZTN9S/giphy.gif',
    'https://media.giphy.com/media/VbnUQpnihPSIgIXuZv/giphy.gif',
    'https://media.giphy.com/media/u9BxQbM5bxvsc/giphy.gif'
  ];
  var catIndex = 0;

  function loadCat() {
    if (catIndex >= catSources.length) {
      catGif.style.display = 'none';
      catFallback.style.display = 'block';
      return;
    }
    catGif.src = catSources[catIndex];
  }

  catGif.addEventListener('error', function () {
    catIndex++;
    loadCat();
  });

  loadCat();

  /* Pencere boyutu değişirse kaçan "Hayır" ekranda kalsın */
  window.addEventListener('resize', function () {
    ['hayir1', 'hayir2'].forEach(function (id) {
      var el = document.getElementById(id);
      if (!el || el.style.position !== 'fixed') return;
      var w = el.offsetWidth, h = el.offsetHeight;
      var maxX = Math.max(14, window.innerWidth - w - 14);
      var maxY = Math.max(14, window.innerHeight - h - 14);
      var x = Math.min(parseFloat(el.style.left) || 14, maxX);
      var y = Math.min(parseFloat(el.style.top) || 14, maxY);
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    });
  });

})();
</script>
</body>
</html>
